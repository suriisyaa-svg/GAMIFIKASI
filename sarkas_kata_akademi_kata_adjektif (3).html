<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARKAS KATA: Akademi Kata Adjektif</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for Grand 3D Vintage Circus World Backdrop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Classical European Vintage Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* ==========================================================================
       BRIGHT, COLOURFUL & HARMONIOUS VINTAGE CIRCUS DESIGN SYSTEM
       ========================================================================== */
    :root {
      --crimson-festive: #8C1D2F;
      --ruby-velvet: #A62639;
      --gold-antique: #D4A14A;
      --gold-bright: #FFE08A;
      --gold-shadow: #9E6E1E;
      --ivory-warm: #FFFDF8;
      --cream-parchment: #FFF6E5;
      --emerald-festive: #1F6E58;
      --sapphire-festive: #224B7A;
      --coral-festive: #D65A47;
      --plum-festive: #5C2B6E;
      --turquoise-festive: #2B8C94;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #3D121D;
      color: #2B1317;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-marquee {
      font-family: 'Cinzel Decorative', serif;
    }

    .font-serif-title {
      font-family: 'Cinzel', serif;
    }

    .font-editorial {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* High-Contrast Readability Surfaces & Typography Utilities */
    .surface-ivory {
      background-color: #FFFDF8;
      color: #1F0B10;
    }

    .surface-deep-velvet {
      background: linear-gradient(180deg, #4A0D18 0%, #310710 100%);
      color: #FFFDF8;
    }

    .panel-readable-light {
      background-color: #FFFDF9;
      color: #1C0A0E;
      border: 2px solid #D4A14A;
      box-shadow: 0 10px 28px rgba(24, 5, 10, 0.22);
    }

    .panel-readable-dark {
      background-color: #2A0912;
      color: #FFFDF8;
      border: 2px solid #FFE08A;
      box-shadow: 0 12px 30px rgba(10, 2, 5, 0.45);
    }

    /* 3D Perspective & Architectural Depth System */
    .perspective-stage {
      perspective: 1400px;
      transform-style: preserve-3d;
    }

    .card-3d-tilt {
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .card-3d-tilt:hover {
      transform: translateY(-6px) rotateX(2.5deg);
      box-shadow:
        0 24px 48px rgba(10, 2, 4, 0.72),
        0 0 0 2px #E5C17B,
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .arch-proscenium {
      position: relative;
      box-shadow:
        0 28px 65px rgba(8, 2, 4, 0.85),
        0 0 0 3px #C69749,
        0 0 0 7px #2C060B,
        0 0 0 9px #E5C17B,
        inset 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .pillar-fluted-left,
    .pillar-fluted-right {
      background: linear-gradient(
        90deg,
        #5E4014 0%,
        #C69749 18%,
        #F5DC9B 38%,
        #A87B32 62%,
        #E5C17B 82%,
        #472F0D 100%
      );
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
    }

    .pedestal-3d {
      background: linear-gradient(180deg, #E5C17B 0%, #9E7328 24%, #4A0E17 26%, #2A050A 92%, #C69749 100%);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.65), inset 0 2px 3px rgba(255, 248, 225, 0.5);
    }

    @keyframes spotlightSweepLeft {
      0%, 100% { transform: rotate(-14deg) scaleY(1.04); opacity: 0.36; }
      50% { transform: rotate(8deg) scaleY(1.12); opacity: 0.52; }
    }

    @keyframes spotlightSweepRight {
      0%, 100% { transform: rotate(14deg) scaleY(1.04); opacity: 0.36; }
      50% { transform: rotate(-8deg) scaleY(1.12); opacity: 0.52; }
    }

    .light-beam-left {
      transform-origin: top center;
      animation: spotlightSweepLeft 9s ease-in-out infinite;
      background: conic-gradient(from 165deg at 50% 0%, transparent 0deg, rgba(255, 236, 184, 0.32) 15deg, transparent 32deg);
      pointer-events: none;
    }

    .light-beam-right {
      transform-origin: top center;
      animation: spotlightSweepRight 11s ease-in-out infinite;
      background: conic-gradient(from 165deg at 50% 0%, transparent 0deg, rgba(255, 236, 184, 0.32) 15deg, transparent 32deg);
      pointer-events: none;
    }

    @keyframes curtainSway {
      0%, 100% { transform: skewX(0deg) scaleX(1); }
      50% { transform: skewX(0.7deg) scaleX(1.015); }
    }

    .curtain-breathing {
      animation: curtainSway 7s ease-in-out infinite;
    }

    @keyframes chandelierSway {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.2deg); }
    }

    .chandelier-sway {
      transform-origin: top center;
      animation: chandelierSway 6.5s ease-in-out infinite;
    }

    /* Rich Velvet & Circus Tent Striping Textures */
    .bg-velvet-burgundy {
      background: radial-gradient(circle at 50% 25%, rgba(117, 28, 40, 0.92) 0%, rgba(90, 20, 30, 0.94) 48%, rgba(42, 6, 11, 0.96) 100%);
    }

    .bg-parchment {
      background: linear-gradient(180deg, #FAF5EA 0%, #EFE4CE 100%);
    }

    .circus-tent-stripes {
      background: repeating-linear-gradient(
        90deg,
        #5A141E 0px,
        #5A141E 44px,
        #EFE4CE 44px,
        #EFE4CE 88px
      );
    }

    .circus-stripes-teal-rose {
      background: repeating-linear-gradient(
        90deg,
        #1D5B66 0px,
        #1D5B66 42px,
        #B86B77 42px,
        #B86B77 84px,
        #E8D8BE 84px,
        #E8D8BE 126px
      );
    }

    .circus-stripes-royal-forest {
      background: repeating-linear-gradient(
        90deg,
        #1B365D 0px,
        #1B365D 44px,
        #1B3B2B 44px,
        #1B3B2B 88px
      );
    }
    /* Rich Velvet & Festive Circus Tent Striping Textures */
    .bg-velvet-burgundy {
      background: radial-gradient(circle at 50% 25%, rgba(166, 38, 57, 0.94) 0%, rgba(124, 24, 39, 0.96) 52%, rgba(74, 14, 24, 0.98) 100%);
    }

    .bg-parchment {
      background: linear-gradient(180deg, #FFFDF8 0%, #FFF3DC 100%);
    }

    .circus-tent-stripes {
      background: repeating-linear-gradient(
        90deg,
        #9E2235 0px,
        #9E2235 44px,
        #FFF6E5 44px,
        #FFF6E5 88px
      );
    }

    .circus-festive-awning {
      background: repeating-linear-gradient(
        90deg,
        #A62639 0px,
        #A62639 42px,
        #FFF6E5 42px,
        #FFF6E5 84px,
        #224B7A 84px,
        #224B7A 126px,
        #FFF6E5 126px,
        #FFF6E5 168px
      );
    }

    .curtain-pleats-left {
      background: repeating-linear-gradient(
        90deg,
        #5C101C 0px,
        #9E2235 18px,
        #731524 34px,
        #B52A3F 52px
      );
      box-shadow: inset -18px 0 36px rgba(25, 4, 8, 0.55);
    }

    .curtain-pleats-right {
      background: repeating-linear-gradient(
        270deg,
        #5C101C 0px,
        #9E2235 18px,
        #731524 34px,
        #B52A3F 52px
      );
      box-shadow: inset 18px 0 36px rgba(25, 4, 8, 0.55);
    }

    /* Ornate Antique Gold Framing */
    .gold-frame {
      border: 2px solid var(--gold-antique);
      box-shadow:
        0 18px 40px rgba(15, 3, 5, 0.65),
        inset 0 0 0 4px rgba(198, 151, 73, 0.25),
        inset 0 0 24px rgba(198, 151, 73, 0.14);
    }

    .gold-card {
      border: 1.5px solid var(--gold-antique);
      box-shadow: 0 10px 26px rgba(24, 6, 9, 0.28);
    }

    /* Warm Marquee Bulbs */
    @keyframes marqueeGlow {
      0%, 100% {
        background-color: #FFF3C4;
        box-shadow: 0 0 8px #E5C17B, 0 0 14px rgba(229, 193, 123, 0.65);
      }
      50% {
        background-color: #D49E42;
        box-shadow: 0 0 3px #8C6322;
      }
    }

    .marquee-bulb {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      border: 1px solid #754E14;
      animation: marqueeGlow 2.4s infinite ease-in-out;
    }

    .marquee-bulb:nth-child(even) {
      animation-delay: 1.2s;
    }

    /* Theatrical Curtain Transition Overlay */
    .curtain-panel {
      transition: transform 1.25s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .curtains-open .curtain-left {
      transform: translateX(-100%) rotateY(14deg);
    }

    .curtains-open .curtain-right {
      transform: translateX(100%) rotateY(-14deg);
    }

    /* Refined Buttons */
    .btn-vintage-gold {
      background: linear-gradient(180deg, #FFE48F 0%, #D9A443 58%, #B57F24 100%);
      color: #1F060A;
      font-family: 'Plus Jakarta Sans', sans-serif;
      border: 2px solid #FFF7DB;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      transition: all 0.22s ease;
    }

    .btn-vintage-gold:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #FFEDB3 0%, #E2AF4E 58%, #C28A2B 100%);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
    }

    .btn-vintage-gold:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-vintage-gold:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-burgundy {
      background: linear-gradient(180deg, #8C1D2F 0%, #59101C 100%);
      color: #FFFDF8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      border: 2px solid #FFE08A;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .btn-burgundy:hover:not(:disabled) {
      background: linear-gradient(180deg, #A32438 0%, #6E1423 100%);
      transform: translateY(-1px);
    }

    /* Floating Balloon Animation */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }

    .float-balloon {
      animation: gentleFloat 3.8s ease-in-out infinite;
    }

    .float-balloon-delay {
      animation: gentleFloat 4.3s ease-in-out 1.1s infinite;
    }

    @keyframes popBurst {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.28); opacity: 0.75; }
      100% { transform: scale(0); opacity: 0; }
    }

    .balloon-popped {
      animation: popBurst 0.45s forwards ease-out;
      pointer-events: none;
    }

    /* Subtle Character Breathing & Portrait Presence */
    @keyframes characterIdle {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }

    .character-idle-anim {
      animation: characterIdle 4.2s ease-in-out infinite;
    }

    /* Interactive 3D Booth Canvas Frame */
    .booth-3d-viewport {
      box-shadow:
        inset 0 0 26px rgba(45, 16, 22, 0.35),
        0 14px 30px rgba(35, 10, 16, 0.35);
      touch-action: none;
    }

    /* Special Cover Page Dimensional Marquee Typography & Vintage Ticket Button */
    .title-3d-circus {
      color: #FFF6D6;
      text-shadow:
        0 2px 0 #D4A14A,
        0 4px 0 #B37E24,
        0 6px 0 #7C4F0C,
        0 8px 0 #471019,
        0 14px 26px rgba(15, 2, 5, 0.88),
        0 0 32px rgba(255, 224, 138, 0.45);
    }

    @keyframes ticketPulseGlow {
      0%, 100% {
        box-shadow:
          0 10px 28px rgba(14, 2, 5, 0.72),
          0 0 0 3px #FFF3C4,
          0 0 24px rgba(255, 224, 138, 0.65),
          inset 0 2px 1px rgba(255, 255, 255, 0.85);
      }
      50% {
        box-shadow:
          0 14px 34px rgba(14, 2, 5, 0.82),
          0 0 0 3px #FFFDF5,
          0 0 38px rgba(255, 224, 138, 0.95),
          inset 0 2px 1px rgba(255, 255, 255, 0.95);
      }
    }

    .btn-circus-ticket {
      position: relative;
      background: linear-gradient(180deg, #FFE699 0%, #D9A443 52%, #A9751E 100%);
      color: #2B070C;
      border: 2px solid #FFF7DB;
      animation: ticketPulseGlow 2.8s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.2s ease;
    }

    .btn-circus-ticket:hover {
      transform: translateY(-3px) scale(1.03);
      filter: brightness(1.07);
    }

    .btn-circus-ticket:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Subtle Fade In */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up {
      animation: fadeSlideUp 0.55s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#3D121D] text-[#2B1317] antialiased">

  <!-- ==========================================================================
       APPLICATION LOGIC, THREE.JS WORLD, AUDIO ENGINE, 5 GAMES & FEEDBACK SYSTEM
       ========================================================================== -->
  <script>
    /* ==========================================================================
       PAGE 1: SPECIAL COVER PAGE — GRAND 3D VINTAGE CIRCUS OPENING POSTER
       ========================================================================== */
    const CoverPage3D = (() => {
      let scene, camera, renderer, animId;
      let elephantGroup, acrobatGroup, ringmasterGroup, jugglerGroup, confettiSystem;
      let jugglingBalls = [];
      let pointerNorm = { x: 0, y: 0 };

      function buildElephant() {
        const g = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ color: 0x9bb7c9, roughness: 0.32, metalness: 0.08 });
        const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xf4a4b4, roughness: 0.4 });
        const royalRedMat = new THREE.MeshStandardMaterial({ color: 0xb8253c, roughness: 0.32 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xf7cf68, metalness: 0.82, roughness: 0.2 });
        const ivoryMat = new THREE.MeshStandardMaterial({ color: 0xfff8e7, roughness: 0.25 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1b1014 });

        // Ornate Circus Pedestal Drum
        const drumBody = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.25, 0.72, 28), royalRedMat);
        drumBody.position.y = 0.36;
        g.add(drumBody);
        const drumTop = new THREE.Mesh(new THREE.CylinderGeometry(1.22, 1.22, 0.14, 28), goldMat);
        drumTop.position.y = 0.75;
        g.add(drumTop);
        const drumBot = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.14, 28), goldMat);
        drumBot.position.y = 0.07;
        g.add(drumBot);

        // Plump Cute Elephant Body & Saddle Blanket
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.92, 26, 22), skinMat);
        torso.scale.set(1.05, 1.08, 1.22);
        torso.position.set(0, 1.68, -0.05);
        g.add(torso);

        const saddle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.95, 0.98, 0.72, 24, 1, true, -Math.PI * 0.42, Math.PI * 0.84),
          royalRedMat
        );
        saddle.rotation.z = Math.PI / 2;
        saddle.position.set(0, 1.76, -0.05);
        g.add(saddle);

        // 4 Cute Column Legs with Gold Anklets
        [[-0.44, 0.42], [0.44, 0.42], [-0.44, -0.45], [0.44, -0.45]].forEach(([lx, lz]) => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.68, 18), skinMat);
          leg.position.set(lx, 1.08, lz);
          g.add(leg);
          const anklet = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.045, 10, 20), goldMat);
          anklet.rotation.x = Math.PI / 2;
          anklet.position.set(lx, 0.84, lz);
          g.add(anklet);
        });

        // Big Friendly Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.74, 26, 22), skinMat);
        head.position.set(0, 2.38, 0.68);
        g.add(head);

        // Large Fan Ears
        [-0.78, 0.78].forEach((ex) => {
          const ear = new THREE.Mesh(new THREE.SphereGeometry(0.54, 20, 18), skinMat);
          ear.scale.set(0.25, 1.05, 0.85);
          ear.position.set(ex, 2.42, 0.56);
          ear.rotation.y = ex > 0 ? -0.35 : 0.35;
          g.add(ear);

          const inner = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 14), innerEarMat);
          inner.scale.set(0.26, 0.95, 0.78);
          inner.position.set(ex * 0.96, 2.42, 0.6);
          inner.rotation.y = ex > 0 ? -0.35 : 0.35;
          g.add(inner);
        });

        // Cheerful Raised Curved Trunk

      function mount(containerId) {
        cleanup();
        const container = document.getElementById(containerId);
        if (!container || typeof THREE === 'undefined') return;

        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 80);
        camera.position.set(0, 3.2, 13.5);
        camera.lookAt(0, 2.2, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Bright, Magical Stage Lighting
        scene.add(new THREE.AmbientLight(0xfff7e6, 1.15));
        const hemi = new THREE.HemisphereLight(0xfff8e7, 0x6e1f33, 0.85);
        scene.add(hemi);

        const keyLight = new THREE.SpotLight(0xfff1c2, 2.1, 45, Math.PI / 3, 0.35);
        keyLight.position.set(0, 12, 11);
        scene.add(keyLight);

        const leftFill = new THREE.PointLight(0xffb74d, 1.3, 25);
        leftFill.position.set(-7, 5, 6);
        scene.add(leftFill);

        const rightFill = new THREE.PointLight(0x4dd0e1, 1.2, 25);
        rightFill.position.set(7, 5, 6);
        scene.add(rightFill);

        // Left Foreground Attraction: Adorable Dressed Circus Elephant
        elephantGroup = buildElephant();
        elephantGroup.position.set(-4.35, -0.45, 2.2);
        elephantGroup.rotation.y = 0.42;
        scene.add(elephantGroup);

        // Right Foreground Attraction: Welcoming Ringmaster & Playful Juggler
        ringmasterGroup = buildRingmaster();
        ringmasterGroup.position.set(3.55, -0.45, 2.3);
        ringmasterGroup.rotation.y = -0.38;
        scene.add(ringmasterGroup);

        jugglerGroup = buildJuggler();
        jugglerGroup.position.set(5.35, -0.45, 1.2);
        jugglerGroup.rotation.y = -0.48;
        scene.add(jugglerGroup);

        // Upper Right/Left Dynamic Aerial Acrobat on Golden Lyra Hoop
        acrobatGroup = buildAerialAcrobat();
        acrobatGroup.position.set(-3.45, 3.85, 1.4);
        scene.add(acrobatGroup);

        // Festive Floating Confetti & Golden Sparkles
        const count = 160;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const cols = new Float32Array(count * 3);
        const palette = [
          new THREE.Color(0xffe082),
          new THREE.Color(0xff8a65),
          new THREE.Color(0x4dd0e1),
          new THREE.Color(0xf48fb1),
          new THREE.Color(0xfff8e7)
        ];
        for (let i = 0; i < count; i++) {
          pos[i * 3] = (Math.random() - 0.5) * 16;
          pos[i * 3 + 1] = Math.random() * 8 - 0.5;
          pos[i * 3 + 2] = (Math.random() - 0.5) * 8;
          const c = palette[i % palette.length];
          cols[i * 3] = c.r;
          cols[i * 3 + 1] = c.g;
          cols[i * 3 + 2] = c.b;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        confettiSystem = new THREE.Points(
          geo,
          new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, opacity: 0.9 })
        );
        scene.add(confettiSystem);

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('resize', onResize);

        function animate() {
          animId = requestAnimationFrame(animate);
          const t = performance.now() * 0.002;

          // Subtle camera parallax following cursor
          camera.position.x += (pointerNorm.x * 0.65 - camera.position.x) * 0.04;
          camera.position.y += (3.2 + pointerNorm.y * 0.35 - camera.position.y) * 0.04;
          camera.lookAt(0, 2.25, 0);

          // Elephant cheerful sway & ear/head bob
          if (elephantGroup) {
            elephantGroup.rotation.y = 0.42 + Math.sin(t * 0.9) * 0.08;
            elephantGroup.position.y = -0.45 + Math.abs(Math.sin(t * 1.4)) * 0.06;
          }

          // Graceful swinging aerial acrobat
          if (acrobatGroup) {
            acrobatGroup.rotation.z = Math.sin(t * 1.1) * 0.14;
            acrobatGroup.rotation.y = Math.sin(t * 0.7) * 0.22;
          }

          // Ringmaster & Juggler lively motion
          if (ringmasterGroup) {
            ringmasterGroup.position.y = -0.45 + Math.sin(t * 1.6) * 0.04;
          }
          if (jugglerGroup) {
            jugglerGroup.position.y = -0.45 + Math.cos(t * 1.6) * 0.04;
            jugglingBalls.forEach((b) => {
              const a = t * 2.4 + b.userData.phase;
              b.position.set(Math.cos(a) * 0.62, 2.65 + Math.sin(a) * 0.58, 0.28);
            });
          }

          // Gentle confetti drift
          if (confettiSystem) {
            confettiSystem.rotation.y = Math.sin(t * 0.25) * 0.14;
            confettiSystem.position.y = Math.sin(t * 0.6) * 0.18;
          }

          renderer.render(scene, camera);
        }

        animate();
      }

      function onMouseMove(e) {
        pointerNorm.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNorm.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }

      function onResize() {
        if (!renderer || !camera) return;
        const container = document.getElementById('cover3dStage');
        if (!container) return;
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function cleanup() {
        if (animId) cancelAnimationFrame(animId);
        animId = null;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('resize', onResize);
        if (renderer) {
          renderer.dispose();
          renderer = null;
        }
      }

      return { mount, cleanup };
    })();

      function createStripedTexture(colorA, colorB, stripes = 20) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const stripeW = canvas.width / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = i % 2 === 0 ? colorA : colorB;
          ctx.fillRect(i * stripeW, 0, stripeW, canvas.height);
        }
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, 'rgba(255,248,225,0.18)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.12)');
        grad.addColorStop(1, 'rgba(35,10,16,0.18)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
      }

        targetLookAt = { x: profile.look[0], y: profile.look[1], z: profile.look[2] };
        targetFogColor = new THREE.Color(profile.fog);
      }

      function animate() {
        requestAnimationFrame(animate);
        if (!initialized) return;

        const t = performance.now() * 0.001;

        // Smooth cinematic camera glide
        camera.position.x += (targetCamPos.x - camera.position.x) * 0.035;
        camera.position.y += (targetCamPos.y - camera.position.y) * 0.035;
        camera.position.z += (targetCamPos.z - camera.position.z) * 0.035;

        currentLookAt.x += (targetLookAt.x - currentLookAt.x) * 0.04;
        currentLookAt.y += (targetLookAt.y - currentLookAt.y) * 0.04;
        currentLookAt.z += (targetLookAt.z - currentLookAt.z) * 0.04;
        camera.lookAt(currentLookAt.x, currentLookAt.y, currentLookAt.z);

        // Smooth atmospheric colour shift
        scene.fog.color.lerp(targetFogColor, 0.03);
        scene.background.lerp(targetFogColor, 0.03);

        // Slowly rotate Ferris Wheel & Carousel
        if (ferrisWheelGroup) ferrisWheelGroup.rotation.z += 0.0022;
        if (carouselGroup) carouselGroup.rotation.y += 0.0045;

        // Gentle drift of illuminated dust particles
        if (dustParticles) {
          dustParticles.rotation.y = Math.sin(t * 0.12) * 0.18;
          dustParticles.position.y = Math.sin(t * 0.45) * 0.25;
        }

        renderer.render(scene, camera);
      }

      return { init, setSceneForPage };

       1. SYNTHESIZED VINTAGE CIRCUS AUDIO ENGINE (Web Audio API)
       ========================================================================== */
    const AudioEngine = (() => {
      let ctx = null;
      let enabled = true;
      let bgmInterval = null;
      let noteIndex = 0;

      // Gentle classical waltz calliope notes (C major / G7 soft carousel melody)
      const waltzNotes = [
        261.63, 329.63, 392.00, 329.63, 293.66, 349.23,
        392.00, 329.63, 261.63, 246.94, 293.66, 392.00
      ];

      function init() {
        if (!ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            ctx = new AudioContextClass();
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
      }

      function startMusic() {
        init();
        if (!enabled || bgmInterval || !ctx) return;
        bgmInterval = setInterval(() => {
          if (!enabled || !ctx || ctx.state !== 'running') return;
          const freq = waltzNotes[noteIndex % waltzNotes.length];
          noteIndex++;
          playSoftTone(freq, 0.42, 'sine', 0.025);
        }, 560);
      }

      function stopMusic() {
        if (bgmInterval) {
          clearInterval(bgmInterval);
          bgmInterval = null;
        }
      }

      function playSoftTone(freq, duration, type = 'sine', volume = 0.08) {
        if (!enabled) return;
        init();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      return {
        toggle() {
          enabled = !enabled;
          if (enabled) {
            startMusic();
            playSoftTone(523.25, 0.18, 'triangle', 0.07);
          } else {
            stopMusic();
          }
          return enabled;
        },
        isEnabled() {
          return enabled;
        },
        startMusic,
        playBell() {
          playSoftTone(783.99, 0.25, 'sine', 0.08);
          setTimeout(() => playSoftTone(1046.5, 0.35, 'sine', 0.07), 90);
        },
        playPop() {
          if (!enabled) return;
          init();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.11);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
          setTimeout(() => playSoftTone(659.25, 0.22, 'sine', 0.06), 110);
        },
        playTrain() {
          playSoftTone(293.66, 0.22, 'triangle', 0.09);
          setTimeout(() => playSoftTone(369.99, 0.36, 'triangle', 0.09), 180);
        },
        playRingToss() {
          playSoftTone(587.33, 0.16, 'sine', 0.07);
          setTimeout(() => playSoftTone(880.0, 0.28, 'sine', 0.08), 120);
        },
        playSplash() {
          playSoftTone(440, 0.14, 'sine', 0.07);
          setTimeout(() => playSoftTone(554.37, 0.18, 'sine', 0.07), 80);
          setTimeout(() => playSoftTone(659.25, 0.24, 'sine', 0.07), 160);
        },
        playStageChime() {
          playSoftTone(523.25, 0.22, 'triangle', 0.08);
          setTimeout(() => playSoftTone(659.25, 0.22, 'triangle', 0.08), 110);
          setTimeout(() => playSoftTone(783.99, 0.34, 'triangle', 0.09), 220);
        },
        playGentleTryAgain() {
          playSoftTone(329.63, 0.18, 'sine', 0.06);
          setTimeout(() => playSoftTone(277.18, 0.24, 'sine', 0.05), 140);
        },
        playFanfare() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, idx) => {
            setTimeout(() => playSoftTone(n, 0.35, 'triangle', 0.09), idx * 130);
          });
        },
        playCurtainWhoosh() {
          playSoftTone(196.0, 0.45, 'sine', 0.05);
        }
      };
    })();

    function updateHeaderUI() {
      const header = document.getElementById('topHeader');
      if (state.currentPage === 'entrance') {
        header.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
      }

      document.getElementById('headerStars').textContent = state.stars;
      document.getElementById('headerPoints').textContent = state.points;

      const charBadge = document.getElementById('headerCharBadge');
      if (state.character) {
        charBadge.classList.remove('hidden');
        document.getElementById('headerCharName').textContent = state.character;
      }

      const arenaBtn = document.getElementById('btnArenaNav');
      if (['game1', 'game2', 'game3', 'game4', 'game5', 'learn'].includes(state.currentPage)) {
        arenaBtn.classList.remove('hidden');
      } else {
        arenaBtn.classList.add('hidden');
      }
    }

    function awardGameCompletion(gameKey, earnedStars, earnedPoints, badgeTitle) {
      if (!state.completedGames[gameKey]) {
        state.completedGames[gameKey] = true;
        state.gameStars[gameKey] = earnedStars;
        state.gamePoints[gameKey] = earnedPoints;
        state.stars += earnedStars;
        state.points += earnedPoints;
        if (!state.badges.includes(badgeTitle)) {
          state.badges.push(badgeTitle);
        }
      } else {
        // If replayed, keep best score
        if (earnedPoints > (state.gamePoints[gameKey] || 0)) {
          const diffPts = earnedPoints - (state.gamePoints[gameKey] || 0);
          state.gamePoints[gameKey] = earnedPoints;
          state.points += diffPts;
        }
        if (earnedStars > (state.gameStars[gameKey] || 0)) {
          const diffStars = earnedStars - (state.gameStars[gameKey] || 0);
          state.gameStars[gameKey] = earnedStars;
          state.stars += diffStars;
        }
      }
      updateHeaderUI();
      AudioEngine.playFanfare();
    }

    /* ==========================================================================
       5. NAVIGATION & THEATRICAL TRANSITIONS
       ========================================================================== */
    let activeBoothCleanup = null;

    function cleanupActiveBooth() {
      if (typeof activeBoothCleanup === 'function') {
        activeBoothCleanup();
        activeBoothCleanup = null;
      }
    }

    function triggerCurtainTransition(callback) {
      const curtains = document.getElementById('transitionCurtains');
      AudioEngine.playCurtainWhoosh();
      curtains.classList.remove('curtains-open');
      setTimeout(() => {
        cleanupActiveBooth();
        callback();
        window.scrollTo({ top: 0, behavior: 'instant' });
        setTimeout(() => {
          curtains.classList.add('curtains-open');
        }, 180);
      }, 950);
    }

    function navigateTo(page, useCurtains = true) {
      Circus3DWorld.setSceneForPage(page);
      if (useCurtains) {
        triggerCurtainTransition(() => {
          state.currentPage = page;
          renderApp();
        });
      } else {
        cleanupActiveBooth();
        state.currentPage = page;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function startAdventure() {
      AudioEngine.startMusic();
      AudioEngine.playBell();
      navigateTo('character', true);
    }

    function renderApp() {
      updateHeaderUI();
      const root = document.getElementById('appRoot');
      switch (state.currentPage) {
        case 'entrance':
          renderEntrancePage(root);
          break;
        case 'character':
          renderCharacterPage(root);
          break;
        case 'learn':
          renderLearnPage(root);
          break;
        case 'arena':
          renderArenaPage(root);
          break;
        case 'game1':

          break;
        case 'game2':

          break;
        case 'game3':

          break;
        case 'game4':
          renderGame4DuckPond(root);
          break;
        case 'game5':
          renderGame5TheatreStage(root);
          break;
        case 'celebration':
          renderCelebrationPage(root);
          break;
        case 'feedback':
          renderFeedbackPage(root);
          break;
        default:
          renderEntrancePage(root);
      }
    }

    function startG1() {
      AudioEngine.playBell();
      g1State = { started: true, roundIdx: 0, poppedIndices: [], feedback: null, completed: false };
      renderApp();
    }

    function clickG1Balloon(idx) {
      const round = g1Rounds[g1State.roundIdx];
      if (g1State.poppedIndices.includes(idx)) return;
      const item = round.balloons[idx];

      if (item.correct) {
        AudioEngine.playPop();
        g1State.poppedIndices.push(idx);
        g1State.feedback = {
          isCorrect: true,
          dialogue: getHelperDialogue('correct'),
          explanation: `Tepat! ${item.reason}`
        };

        if (g1State.poppedIndices.length >= round.targetCount) {
          renderApp();
          setTimeout(() => {
            if (g1State.roundIdx + 1 < g1Rounds.length) {
              g1State.roundIdx++;
              g1State.poppedIndices = [];
              g1State.feedback = null;
              AudioEngine.playBell();
              renderApp();
            } else {
              g1State.completed = true;
              awardGameCompletion('game1', 3, 150, 'Penjinak Belon Ajaib');
              renderApp();
            }
          }, 1250);
          return;
        }
      } else {
        AudioEngine.playGentleTryAgain();
        g1State.feedback = {
          isCorrect: false,
          dialogue: getHelperDialogue('wrong'),
          explanation: `Kurang tepat. ${item.reason} Cuba pilih belon lain!`
        };
      }
      renderApp();
    }

    function startG2() {
      AudioEngine.playBell();

      renderApp();
    }

    function handleG2Drop(event) {
      event.preventDefault();
      const word = event.dataTransfer.getData('text/plain');
      if (word) submitG2Word(word);
    }

    function submitG2Word(word) {
      if (g2State.solvedCurrent) return;
      const q = g2Questions[g2State.qIdx];

      if (word === q.answer) {
        AudioEngine.playTrain();
        g2State.solvedCurrent = true;
        g2State.feedback = {
          isCorrect: true,
          dialogue: getHelperDialogue('correct'),
          explanation: q.explanation
        };
        renderApp();

        setTimeout(() => {
          if (g2State.qIdx + 1 < g2Questions.length) {
            g2State.qIdx++;
            g2State.solvedCurrent = false;
            g2State.feedback = null;
            renderApp();
          } else {
            g2State.completed = true;
            awardGameCompletion('game2', 3, 160, 'Konduktor Kata Ekspres');
            renderApp();
          }
        }, 1800);
      } else {
        AudioEngine.playGentleTryAgain();
        g2State.feedback = {
          isCorrect: false,
          dialogue: getHelperDialogue('wrong'),
          explanation: `Perkataan “${word}” kurang sesuai dengan maksud ayat di atas. Baca petunjuk situasi dalam ayat dan cuba lagi!`
        };
        renderApp();
      }
    }

    /* ==========================================================================
       GAME 3: KARNIVAL LONTAR GELUNG (BRIGHT, COLOURFUL 3D BOTTLE & RING TOSS)
       Focus: Bentuk, Waktu & Ukuran Clues (Unique)
       ========================================================================== */
    const g3Rounds = [
      {
        mission: 'Baling gelung emas ke arah botol yang membawa perkataan <strong>kata adjektif bentuk</strong> seperti rupa sebiji telur!',

    let g3State = {
      started: false,
      rIdx: 0,
      aimLane: 0, // 0..3 corresponding to target bottles
      throwing: false,
      landedWord: null,
      feedback: null,
      completed: false
    };

    const G3Booth3D = (() => {
      let scene, camera, renderer, animId;
      let bottleGroups = [];
      let ringMesh = null;
      let aimGuideMesh = null;
      let sparkleGroup = null;
      let throwAnim = null;

      function createBoothStripes() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const cols = ['#b8293d', '#fff7e6', '#2962a8', '#fff7e6'];
        const w = canvas.width / 12;
        for (let i = 0; i < 12; i++) {
          ctx.fillStyle = cols[i % cols.length];
          ctx.fillRect(i * w, 0, w, canvas.height);
        }
        return new THREE.CanvasTexture(canvas);
      }

      function mount(containerId, targets, onSelectLane, onThrowResult) {
        cleanup();
        const container = document.getElementById(containerId);
        if (!container || typeof THREE === 'undefined') return;

        const width = container.clientWidth || 720;
        const height = 340;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x521c33);
        scene.fog = new THREE.Fog(0x521c33, 12, 28);

        camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 50);
        camera.position.set(0, 4.4, 9.6);
        camera.lookAt(0, 1.35, -1.2);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Bright, Glossy Carnival Booth Lighting
        scene.add(new THREE.AmbientLight(0xfff5e0, 1.05));
        const hemi = new THREE.HemisphereLight(0xfff8e7, 0x702438, 0.7);
        scene.add(hemi);

        const spot = new THREE.SpotLight(0xfff1c4, 1.9, 32, Math.PI / 3.5, 0.35);
        spot.position.set(0, 10, 7);
        scene.add(spot);

        const sideWarm = new THREE.PointLight(0xffb74d, 1.2, 22);
        sideWarm.position.set(-5, 5, 2);
        scene.add(sideWarm);

        // Polished Carnival Counter Table
        const counter = new THREE.Mesh(
          new THREE.BoxGeometry(12.2, 0.7, 7.5),
          new THREE.MeshStandardMaterial({ color: 0x7a2626, roughness: 0.38, metalness: 0.2 })
        );
        counter.position.set(0, -0.35, -1.2);
        scene.add(counter);

        const goldTrim = new THREE.Mesh(
          new THREE.BoxGeometry(12.3, 0.22, 7.6),
          new THREE.MeshStandardMaterial({ color: 0xf5cd6e, roughness: 0.22, metalness: 0.85 })
        );
        goldTrim.position.set(0, 0.03, -1.2);
        scene.add(goldTrim);

        // Colourful Striped Carnival Booth Backdrop & Scalloped Valance
        const backWall = new THREE.Mesh(
          new THREE.PlaneGeometry(14.5, 7.2),
          new THREE.MeshStandardMaterial({ map: createBoothStripes(), roughness: 0.55 })
        );
        backWall.position.set(0, 3.4, -5.0);
        scene.add(backWall);

        // Decorative String of Glowing Marquee Bulbs across Top of Booth
        const bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff5ba });
        for (let b = -5.5; b <= 5.5; b += 1.1) {
          const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), bulbMat);
          bulb.position.set(b, 4.35, -4.85);
          scene.add(bulb);
        }

        // Build 4 Stylised Glossy Carnival Bottles
        bottleGroups = [];
        const positions = [
          { x: -3.3, z: -1.4 },
          { x: -1.1, z: -2.3 },
          { x: 1.1, z: -2.3 },
          { x: 3.3, z: -1.4 }
        ];

        const goldCapMat = new THREE.MeshStandardMaterial({ color: 0xffe082, metalness: 0.85, roughness: 0.2 });
        const stripeBandMat = new THREE.MeshStandardMaterial({ color: 0xfff8e7, roughness: 0.25 });

        targets.forEach((t, idx) => {
          const group = new THREE.Group();
          const bodyMat = new THREE.MeshStandardMaterial({
            color: t.color,
            roughness: 0.18,
            metalness: 0.25
          });

          // Sculpted Golden Pedestal Base
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.76, 0.24, 28), goldCapMat);
          base.position.y = 0.12;
          group.add(base);

          // Glossy Bottle Body
          const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.5, 1.05, 28), bodyMat);
          lower.position.y = 0.74;
          group.add(lower);

          // Decorative Ivory & Gold Belly Band
          const bellyBand = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.48, 0.24, 28), stripeBandMat);
          bellyBand.position.y = 0.74;
          group.add(bellyBand);

          // Rounded Bottle Shoulder
          const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.44, 24, 18, 0, Math.PI * 2, 0, Math.PI / 2), bodyMat);
          shoulder.position.y = 1.25;
          group.add(shoulder);

          // Bottle Neck
          const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.21, 0.58, 24), bodyMat);
          neck.position.y = 1.82;
          group.add(neck);

          // Golden Crown Rim
          const rim = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.05, 14, 28), goldCapMat);
          rim.rotation.x = Math.PI / 2;
          rim.position.y = 2.1;
          group.add(rim);

          // Floating Carnival Signage Plaque above each bottle (High Contrast)
          const labelCanvas = document.createElement('canvas');
          labelCanvas.width = 272;
          labelCanvas.height = 92;
          const ctx = labelCanvas.getContext('2d');
          ctx.fillStyle = '#FFFDF8';
          ctx.fillRect(4, 4, 264, 84);
          ctx.strokeStyle = '#8C1D2F';
          ctx.lineWidth = 8;
          ctx.strokeRect(4, 4, 264, 84);
          ctx.fillStyle = '#1F0B10';
          ctx.font = '800 38px "Plus Jakarta Sans", Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(t.word, 136, 47);

          const labelTex = new THREE.CanvasTexture(labelCanvas);
          const signMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1.92, 0.65),
            new THREE.MeshBasicMaterial({ map: labelTex })
          );
          signMesh.position.set(0, 2.7, 0);
          group.add(signMesh);

          group.position.set(positions[idx].x, 0.08, positions[idx].z);
          group.userData = { laneIdx: idx, word: t.word };
          scene.add(group);
          bottleGroups.push(group);
        });

        // Glowing Aiming Spotlight Ring under active target
        aimGuideMesh = new THREE.Mesh(
          new THREE.RingGeometry(0.78, 1.0, 36),
          new THREE.MeshBasicMaterial({ color: 0xfff3b0, side: THREE.DoubleSide })
        );
        aimGuideMesh.rotation.x = -Math.PI / 2;
        aimGuideMesh.position.set(positions[g3State.aimLane].x, 0.14, positions[g3State.aimLane].z);
        scene.add(aimGuideMesh);

        // Thick Glossy 3D Carnival Ring Ready in Foreground
        ringMesh = new THREE.Mesh(
          new THREE.TorusGeometry(0.55, 0.095, 20, 44),
          new THREE.MeshStandardMaterial({
            color: 0xffdf78,
            metalness: 0.85,
            roughness: 0.16,
            emissive: 0x5c3c08
          })
        );
        ringMesh.rotation.x = Math.PI / 2.3;
        ringMesh.position.set(positions[g3State.aimLane].x * 0.45, 0.85, 4.2);
        scene.add(ringMesh);

        // Celebration Sparkle Stars (hidden until ring lands on target)
        sparkleGroup = new THREE.Group();
        for (let s = 0; s < 10; s++) {
          const star = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.14, 0),
            new THREE.MeshBasicMaterial({ color: s % 2 === 0 ? 0xfff5ba : 0xff8a65 })
          );
          const ang = (s / 10) * Math.PI * 2;
          star.position.set(Math.cos(ang) * 0.85, 1.7 + (s % 2) * 0.25, Math.sin(ang) * 0.85);
          sparkleGroup.add(star);
        }
        sparkleGroup.visible = false;
        scene.add(sparkleGroup);

        // Raycaster so clicking/tapping directly on a 3D bottle aims & throws!
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function handlePointerMove(e) {
          if (throwAnim || g3State.landedWord) return;
          const rect = renderer.domElement.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const normX = ((clientX - rect.left) / rect.width) * 2 - 1;
          let nearest = 0;
          let bestDist = Infinity;
          positions.forEach((p, idx) => {
            const screenApprox = p.x / 4.4;
            const d = Math.abs(normX - screenApprox);
            if (d < bestDist) {
              bestDist = d;
              nearest = idx;
            }
          });
          if (nearest !== g3State.aimLane) {
            onSelectLane(nearest);
          }
        }

        function handlePointerDown(e) {
          if (throwAnim || g3State.landedWord) return;
          const rect = renderer.domElement.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(bottleGroups, true);
          if (hits.length > 0) {
            let obj = hits[0].object;
            while (obj && obj.userData.laneIdx === undefined) obj = obj.parent;
            if (obj && obj.userData.laneIdx !== undefined) {
              onSelectLane(obj.userData.laneIdx);
              launchThrow(obj.userData.laneIdx, onThrowResult);
            }
          }
        }

        renderer.domElement.addEventListener('mousemove', handlePointerMove);
        renderer.domElement.addEventListener('touchmove', handlePointerMove, { passive: true });
        renderer.domElement.addEventListener('click', handlePointerDown);

        function animate() {
          animId = requestAnimationFrame(animate);
          const t = performance.now() * 0.003;

          if (aimGuideMesh && bottleGroups[g3State.aimLane]) {
            const targetPos = bottleGroups[g3State.aimLane].position;
            aimGuideMesh.position.x += (targetPos.x - aimGuideMesh.position.x) * 0.2;
            aimGuideMesh.position.z += (targetPos.z - aimGuideMesh.position.z) * 0.2;
            aimGuideMesh.scale.setScalar(1 + Math.sin(t * 2) * 0.07);
          }

          if (sparkleGroup && sparkleGroup.visible) {
            sparkleGroup.rotation.y += 0.05;
            sparkleGroup.position.y = Math.sin(t * 2.5) * 0.12;
          }

          if (!throwAnim && !g3State.landedWord && ringMesh && bottleGroups[g3State.aimLane]) {
            const targetPos = bottleGroups[g3State.aimLane].position;
            ringMesh.position.x += (targetPos.x * 0.55 - ringMesh.position.x) * 0.16;
            ringMesh.position.y = 0.85 + Math.sin(t * 1.6) * 0.08;
            ringMesh.position.z = 4.2;
            ringMesh.rotation.x = Math.PI / 2.3;
            ringMesh.rotation.z = Math.sin(t) * 0.15;
          }

          if (throwAnim) {
            throwAnim.progress += 0.032;
            const p = Math.min(throwAnim.progress, 1);
            const start = throwAnim.start;
            const end = throwAnim.end;

            // Parabolic arc trajectory through the air
            ringMesh.position.x = start.x + (end.x - start.x) * p;
            ringMesh.position.z = start.z + (end.z - start.z) * p;
            const arcHeight = Math.sin(p * Math.PI) * 2.6;
            ringMesh.position.y = start.y + (end.y - start.y) * p + arcHeight;
            ringMesh.rotation.x = Math.PI / 2 + (1 - p) * Math.PI * 2;

            if (p >= 1) {
              const finishedLane = throwAnim.laneIdx;
              const isSuccess = throwAnim.isSuccess;
              throwAnim = null;
              if (!isSuccess) {
                ringMesh.position.set(end.x + 0.72, 0.24, end.z + 1.35);
                ringMesh.rotation.x = Math.PI / 2;
              } else {
                ringMesh.position.set(end.x, 1.36, end.z);
                ringMesh.rotation.x = Math.PI / 2;
                if (sparkleGroup) {
                  sparkleGroup.position.set(end.x, 0, end.z);
                  sparkleGroup.visible = true;
                }
              }
              onThrowResult(finishedLane);
            }
          }

          renderer.render(scene, camera);
        }

        animate();
      }

      function launchThrow(laneIdx, onThrowResult) {
        if (throwAnim || !bottleGroups[laneIdx] || !ringMesh) return;
        const round = g3Rounds[g3State.rIdx];
        const targetBottle = bottleGroups[laneIdx];
        const isSuccess = targetBottle.userData.word === round.answer;

        throwAnim = {
          laneIdx,
          isSuccess,
          progress: 0,
          start: { x: ringMesh.position.x, y: ringMesh.position.y, z: ringMesh.position.z },
          end: {
            x: targetBottle.position.x + (isSuccess ? 0 : 0.35),
            y: isSuccess ? 1.36 : 0.45,
            z: targetBottle.position.z + (isSuccess ? 0 : 0.45)
          }
        };
      }

      function cleanup() {
        if (animId) cancelAnimationFrame(animId);
        animId = null;
        throwAnim = null;
        if (renderer) {
          renderer.dispose();
          renderer = null;
        }
      }

      return { mount, launchThrow, cleanup };
    })();

    function selectG3Lane(laneIdx) {
      if (g3State.throwing || g3State.landedWord) return;
      g3State.aimLane = laneIdx;
      // Update button active highlights without destroying 3D canvas
      const buttons = document.querySelectorAll('[onclick^="selectG3Lane"]');
      buttons.forEach((btn, idx) => {
        if (idx === laneIdx) {
          btn.className = 'px-4 py-2.5 rounded-xl border-2 text-xs sm:text-sm font-extrabold transition cursor-pointer bg-[#8C1D2F] text-[#FFFDF8] border-[#D4A14A] shadow';

        }
      });
    }

    function triggerG3Throw() {
      if (g3State.throwing || g3State.landedWord) return;
      g3State.throwing = true;
      G3Booth3D.launchThrow(g3State.aimLane, handleG3ThrowComplete);
    }

    function handleG3ThrowComplete(laneIdx) {
      g3State.throwing = false;
      const r = g3Rounds[g3State.rIdx];
      const chosen = r.targets[laneIdx];
      if (!chosen) return;

      if (chosen.word === r.answer) {
        AudioEngine.playRingToss();
        g3State.landedWord = chosen.word;
        g3State.feedback = {
          isCorrect: true,
          dialogue: getHelperDialogue('correct'),
          explanation: r.explanation
        };
        renderApp();

        setTimeout(() => {
          if (g3State.rIdx + 1 < g3Rounds.length) {
            g3State.rIdx++;
            g3State.aimLane = 0;
            g3State.landedWord = null;
            g3State.feedback = null;
            renderApp();
          } else {
            g3State.completed = true;
            awardGameCompletion('game3', 3, 160, 'Jaguh Lontar Gelung');
            renderApp();
          }
        }, 1850);
      } else {
        AudioEngine.playGentleTryAgain();
        g3State.feedback = {
          isCorrect: false,
          dialogue: getHelperDialogue('wrong'),
          explanation: `Gelung melantun dari botol “${chosen.word}”! Baca semula petunjuk misi di atas, bidik botol yang betul dan lontarkan semula.`
        };
        renderApp();
      }
    }

      function mount(containerId, ducks, onSelectDuck, onCatchComplete) {
        cleanup();

        const waterMat = new THREE.MeshStandardMaterial({
          color: 0x36b5c2,
          roughness: 0.14,
          metalness: 0.45,

        });
        waterMesh = new THREE.Mesh(waterGeo, waterMat);

        rippleRings = [];
        [1.5, 2.8, 4.1].forEach((rad, i) => {

          ripple.position.y = 0.025;
          ripple.userData = { baseRad: rad, phase: i * 1.4 };
          scene.add(ripple);
          rippleRings.push(ripple);
        });

        // Build Cute Stylised 3D Cartoon Rubber Ducks
        duckGroups = [];
        const count = ducks.length;
        ducks.forEach((d, idx) => {
          const isCaught = g4State.caughtWords.includes(d.word);
          const group = buildStylisedRubberDuck(d.word, isCaught);

          group.rotation.y = -angle + Math.PI / 2;
          group.visible = !isCaught;
          group.userData = { duckIdx: idx, word: d.word, baseAngle: angle, radius };

          duckGroups.push(group);

        // Bright Target Ring on Water under Selected Duck
        aimRing = new THREE.Mesh(

          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(duckGroups, true);

        function animate() {
          animId = requestAnimationFrame(animate);
          const t = performance.now() * 0.0015;

          // Gentle water ripple pulse
          rippleRings.forEach((r) => {
            const s = 1 + Math.sin(t * 1.6 + r.userData.phase) * 0.035;
            r.scale.set(s, s, 1);
          });

          // Gentle floating and bobbing motion for each cute rubber duck
          duckGroups.forEach((dg, i) => {
            if (!dg.visible) return;
            if (!castAnim || castAnim.duckIdx !== i || castAnim.phase !== 'lift') {
              const orbitAngle = dg.userData.baseAngle + Math.sin(t * 0.5 + i) * 0.14;
              dg.position.x = Math.cos(orbitAngle) * dg.userData.radius;
              dg.position.z = Math.sin(orbitAngle) * dg.userData.radius;
              dg.position.y = 0.05 + Math.sin(t * 2.2 + i * 1.3) * 0.065;
              dg.rotation.z = Math.sin(t * 1.8 + i) * 0.07;
            }
          });

          const activeDuck = duckGroups[g4State.selectedDuckIdx];
          if (activeDuck && activeDuck.visible) {
            aimRing.visible = true;
            aimRing.position.x = activeDuck.position.x;
            aimRing.position.z = activeDuck.position.z;

            if (!castAnim) {
              rodGroup.position.x += (activeDuck.position.x - rodGroup.position.x) * 0.14;
              rodGroup.position.z += (activeDuck.position.z - rodGroup.position.z) * 0.14;
              updateLineLength(1.2);
            }
          } else {
            aimRing.visible = false;
          }

          // Animate lowering hook -> attaching -> lifting rubber duck out of water!
          if (castAnim) {
            const targetDuck = duckGroups[castAnim.duckIdx];
            rodGroup.position.x += (targetDuck.position.x - rodGroup.position.x) * 0.25;
            rodGroup.position.z += (targetDuck.position.z - rodGroup.position.z) * 0.25;

            if (castAnim.phase === 'lower') {
              castAnim.lineLen += 0.09;
              updateLineLength(castAnim.lineLen);
              if (castAnim.lineLen >= 2.45) {
                castAnim.phase = 'lift';
              }
            } else if (castAnim.phase === 'lift') {
              castAnim.lineLen -= 0.08;
              updateLineLength(Math.max(0.75, castAnim.lineLen));
              targetDuck.position.y = (2.45 - castAnim.lineLen) * 1.45;
              targetDuck.rotation.z = Math.sin(t * 8) * 0.12;

              if (castAnim.lineLen <= 0.78) {
                const caughtIdx = castAnim.duckIdx;
                castAnim = null;
                onCatchComplete(caughtIdx);
              }
            }
          }

          renderer.render(scene, camera);
        }

        animate();
      }

      function updateLineLength(len) {
        if (!lineMesh || !hookMesh) return;
        const tipY = 3.65;
        lineMesh.scale.y = len;
        lineMesh.position.y = tipY - len / 2;
        hookMesh.position.y = tipY - len - 0.1;
      }

      function castLineAtDuck(duckIdx, onCatchComplete) {
        if (castAnim || !duckGroups[duckIdx] || !duckGroups[duckIdx].visible) return;
        castAnim = {
          duckIdx,
          phase: 'lower',
          lineLen: 1.2
        };
      }

      function cleanup() {
        if (animId) cancelAnimationFrame(animId);
        animId = null;
        castAnim = null;
        if (renderer) {
          renderer.dispose();
          renderer = null;
        }
      }

      return { mount, castLineAtDuck, cleanup };
    })();

    function startG4() {
      AudioEngine.playBell();
      g4State = {
        started: true,
        stageIdx: 0,
        selectedDuckIdx: 0,
        fishingBusy: false,
        seqStep: 0,
        caughtWords: [],
        feedback: null,
        completed: false
      };
      renderApp();
    }

    function selectG4Duck(idx) {
      if (g4State.fishingBusy) return;
      g4State.selectedDuckIdx = idx;
      const buttons = document.querySelectorAll('[onclick^="selectG4Duck"]');
      buttons.forEach((btn, i) => {
        if (btn.disabled) return;
        if (i === idx) {
          btn.className = 'px-4 py-2.5 rounded-xl border-2 text-xs sm:text-sm font-extrabold transition cursor-pointer bg-[#1F6E58] text-[#FFFDF8] border-[#D4A14A] shadow';
        } else {
          btn.className = 'px-4 py-2.5 rounded-xl border-2 text-xs sm:text-sm font-extrabold transition cursor-pointer bg-[#FFFDF8] text-[#1F0B10] border-[#D4A14A] hover:bg-[#FFE08A]/40';
        }
      });
    }

    function triggerG4Cast() {
      if (g4State.fishingBusy || g4State.completed) return;
      const stage = g4Stages[g4State.stageIdx];
      const duckObj = stage.ducks[g4State.selectedDuckIdx];
      if (!duckObj || g4State.caughtWords.includes(duckObj.word)) return;

      g4State.fishingBusy = true;
      G4Pond3D.castLineAtDuck(g4State.selectedDuckIdx, handleG4CatchComplete);
    }

    function handleG4CatchComplete(duckIdx) {
      g4State.fishingBusy = false;
      if (g4State.completed) return;
      const stage = g4Stages[g4State.stageIdx];
      if (!stage) return;
      const duckObj = stage.ducks[duckIdx];
      if (!duckObj) return;
      const word = duckObj.word;

      if (stage.type === 'single') {
        if (g4State.caughtWords.length > 0) return;
        if (word === stage.answer) {
          AudioEngine.playSplash();
          g4State.caughtWords = [word];
          g4State.feedback = {
            isCorrect: true,
            dialogue: getHelperDialogue('correct'),
            explanation: duckObj.reason
          };
          renderApp();

          setTimeout(() => {
            g4State.stageIdx++;
            g4State.selectedDuckIdx = 0;
            g4State.caughtWords = [];
            g4State.seqStep = 0;
            g4State.feedback = null;
            AudioEngine.playBell();
            renderApp();
          }, 1700);
        } else {
          AudioEngine.playGentleTryAgain();
          g4State.feedback = {
            isCorrect: false,
            dialogue: getHelperDialogue('wrong'),
            explanation: `Itik “${word}” terlepas kembali ke kolam! ${duckObj.reason} Cuba pancing itik yang lain.`
          };
          renderApp();
        }
      } else {
        if (g4State.seqStep >= stage.sequence.length) return;
        const expected = stage.sequence[g4State.seqStep];
        if (!expected) return;
        if (word === expected.answer) {
          AudioEngine.playSplash();
          g4State.caughtWords.push(word);
          g4State.feedback = {
            isCorrect: true,
            dialogue: getHelperDialogue('correct'),
            explanation: `Tepat untuk langkah ${g4State.seqStep + 1} (${expected.category})! ${duckObj.reason}`
          };
          g4State.seqStep++;
          // Advance default aim to next uncaught duck
          const nextUncaught = stage.ducks.findIndex((d) => !g4State.caughtWords.includes(d.word));
          if (nextUncaught >= 0) g4State.selectedDuckIdx = nextUncaught;
          renderApp();

          if (g4State.seqStep >= stage.sequence.length) {
            setTimeout(() => {
              g4State.completed = true;
              awardGameCompletion('game4', 3, 170, 'Pemancing Kata Bijaksana');
              renderApp();
            }, 1600);
          }
        } else {
          AudioEngine.playGentleTryAgain();
          g4State.feedback = {
            isCorrect: false,
            dialogue: getHelperDialogue('wrong'),
            explanation: `Langkah ini memerlukan <strong>${expected.category}</strong>. ${duckObj.reason}`
          };
          renderApp();
        }
      }
    }

    function startG5() {
      AudioEngine.playBell();
      g5State = {
        started: true,
        rIdx: 0,
        arrangedWords: [],
        sentenceArrangedCorrectly: false,
        adjectiveIdentified: false,
        customInput: '',
        feedback: null,
        completed: false
      };
      renderApp();
    }

    function addG5Word(word) {
      if (g5State.sentenceArrangedCorrectly) return;
      AudioEngine.playBell();
      g5State.arrangedWords.push(word);
      g5State.feedback = null;
      renderApp();
    }

    function removeG5Word(idx) {
      if (g5State.sentenceArrangedCorrectly) return;
      g5State.arrangedWords.splice(idx, 1);
      g5State.feedback = null;
      renderApp();
    }

    function resetG5Words() {
      g5State.arrangedWords = [];
      g5State.feedback = null;
      renderApp();
    }

    function checkG5Sentence() {
      const round = g5Rounds[g5State.rIdx];
      const attempt = g5State.arrangedWords.join(' ');
      if (attempt === round.expectedSentence) {
        AudioEngine.playStageChime();
        g5State.sentenceArrangedCorrectly = true;
        g5State.feedback = {
          isCorrect: true,
          dialogue: getHelperDialogue('correct'),
          explanation: `Susunan ayat tepat: “${round.expectedSentence}.” Sekarang pilih kata adjektif dalam ayat tersebut!`
        };
      } else {
        AudioEngine.playGentleTryAgain();
        g5State.feedback = {
          isCorrect: false,
          dialogue: getHelperDialogue('wrong'),
          explanation: `Susunan ayat belum tepat. Mulakan ayat dengan subjek yang berhuruf besar. Cuba susun semula!`
        };
      }
      renderApp();
    }

    function identifyG5Adjective(word) {
      const round = g5Rounds[g5State.rIdx];
      if (word.toLowerCase() === round.targetAdjective.toLowerCase()) {
        AudioEngine.playStageChime();
        g5State.feedback = {
          isCorrect: true,
          dialogue: getHelperDialogue('correct'),
          explanation: round.explanation
        };
        renderApp();

        setTimeout(() => {
          g5State.rIdx++;
          g5State.arrangedWords = [];
          g5State.sentenceArrangedCorrectly = false;
          g5State.feedback = null;
          renderApp();
        }, 1850);
      } else {
        AudioEngine.playGentleTryAgain();
        g5State.feedback = {
          isCorrect: false,
          dialogue: getHelperDialogue('wrong'),
          explanation: `Perkataan “${word}” bukan kata adjektif. Cari perkataan yang menerangkan waktu, warna atau ukuran dalam ayat itu!`
        };
        renderApp();
      }
    }

    function submitG5CustomSentence() {
      const round = g5Rounds[g5State.rIdx];
      const text = g5State.customInput.trim();
      const words = text.split(/\s+/).filter(Boolean);
      const hasKeyword = text.toLowerCase().includes(round.givenAdjective.toLowerCase());

      if (words.length >= 3 && hasKeyword) {
        AudioEngine.playStageChime();
        g5State.feedback = {
          isCorrect: true,
          dialogue: getHelperDialogue('correct'),
          explanation: `Syabas! Ayat kamu “${text}” menggunakan kata adjektif “${round.givenAdjective}” dengan baik dan bermakna.`
        };
        renderApp();

        setTimeout(() => {
          g5State.completed = true;
          awardGameCompletion('game5', 3, 200, 'Pengarah Teater Bahasa');
          renderApp();
        }, 1700);
      } else {
        AudioEngine.playGentleTryAgain();
        g5State.feedback = {
          isCorrect: false,
          dialogue: getHelperDialogue('wrong'),
          explanation: `Sila tulis ayat lengkap (sekurang-kurangnya 3 patah perkataan) yang mengandungi kata adjektif “${round.givenAdjective}”.`
        };
        renderApp();
      }
    }

                      type="button"
                      onclick="toggleTeacherLog()"
                      class="px-4 py-2.5 rounded-xl bg-[#FFF6E5] border-2 border-[#D4A14A] text-[#1F0B10] text-xs sm:text-sm font-bold hover:bg-[#FFE08A]/40 transition cursor-pointer"
                    >
                      📋 Paparan Rekod Guru (${state.teacherLog.length})
                    </button>

                    <button
                      type="submit"
                      class="btn-vintage-gold px-8 py-4 rounded-2xl text-sm sm:text-base font-extrabold uppercase tracking-wider cursor-pointer"
                    >
                      HANTAR MAKLUM BALAS →
                    </button>
                  </div>
                </form>
              `
            }

            <!-- Teacher Review Drawer / Panel -->
            ${
              showTeacherModal
                ? `
                <div class="mt-8 p-5 rounded-2xl bg-[#24060B] text-[#FFFDF8] border-2 border-[#FFE08A] animate-fade-up">
                  <div class="flex items-center justify-between border-b border-[#D4A14A]/50 pb-3 mb-4">
                    <h3 class="text-base sm:text-lg font-extrabold text-[#FFE08A]">
                      Rekod Maklum Balas Murid (Sesi Semasa)
                    </h3>
                    <button onclick="toggleTeacherLog()" class="text-sm text-[#FFE08A] font-bold underline cursor-pointer">Tutup</button>
                  </div>
                  ${
                    state.teacherLog.length === 0
                      ? `<p class="text-sm text-[#FFFDF8]">Belum ada maklum balas dihantar dalam sesi ini.</p>`
                      : `<div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                          ${state.teacherLog
                            .map(
                              (entry, i) => `
                            <div class="p-4 rounded-xl bg-[#3D0A14] border border-[#D4A14A] text-sm space-y-1.5">
                              <div class="flex justify-between text-[#FFE08A] font-bold">
                                <span>Murid #${i + 1} (Watak: ${entry.character})</span>
                                <span>Penilaian: ${'★'.repeat(entry.rating)} (${entry.rating}/5)</span>
                              </div>
                              <p><strong>Tahap Kefahaman:</strong> ${entry.understanding}</p>
                              <p><strong>Bahagian Digemari:</strong> ${entry.favorites.join(', ') || '-'}</p>
                              ${entry.reflection ? `<p><strong>Refleksi Kata Adjektif:</strong> “${entry.reflection}”</p>` : ''}
                              ${entry.comment ? `<p><strong>Komen:</strong> “${entry.comment}”</p>` : ''}
                            </div>
                          `
                            )
                            .join('')}
                        </div>`
                  }
                </div>
              `
                : ''
            }
          </div>
        </section>
      `;
    }

    function setFeedbackRating(score) {
      AudioEngine.playBell();
      state.feedbackData.rating = score;
      renderApp();
    }

    function setFeedbackUnderstanding(opt) {
      AudioEngine.playBell();
      state.feedbackData.understanding = opt;
      renderApp();
    }

    function toggleFeedbackFavorite(opt) {
      AudioEngine.playBell();
      const idx = state.feedbackData.favorites.indexOf(opt);
      if (idx >= 0) {
        state.feedbackData.favorites.splice(idx, 1);
      } else {
        state.feedbackData.favorites.push(opt);
      }
      renderApp();
    }

    function toggleTeacherLog() {
      showTeacherModal = !showTeacherModal;
      renderApp();
    }

    function submitStudentFeedback(event) {
      event.preventDefault();
      const msgBox = document.getElementById('feedbackValidationMsg');

      if (!state.feedbackData.rating || !state.feedbackData.understanding) {
        AudioEngine.playGentleTryAgain();
        msgBox.textContent = 'Sila pilih penilaian bintang (Soalan 1) dan tahap kefahaman kamu (Soalan 2) sebelum menghantar.';
        msgBox.classList.remove('hidden');
        return;
      }

      const record = {
        character: state.character || 'ALI',
        rating: state.feedbackData.rating,
        understanding: state.feedbackData.understanding,
        favorites: [...state.feedbackData.favorites],
        reflection: state.reflectionAnswer.trim(),
        comment: state.feedbackData.comment.trim(),
        timestamp: new Date().toLocaleTimeString('ms-MY')
      };

      state.teacherLog.push(record);
      try {
        sessionStorage.setItem('sarkasKataFeedbackLog', JSON.stringify(state.teacherLog));
      } catch (e) {
        // Ignore storage errors
      }

      state.feedbackSubmitted = true;
      AudioEngine.playFanfare();
      renderApp();
    }

    // Boot Application & 3D Circus World
    window.addEventListener('DOMContentLoaded', () => {
      Circus3DWorld.init();
      renderApp();
    });
  </script>
</body>
</html>
